<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Seguro</title>
</head>
<body style="font-family:Arial;max-width:450px;margin:30px auto;padding:0 20px;">

  <h2>Enviar Solicitud 📱</h2>

  <input type="text" id="nombre" placeholder="Tu nombre" style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;">
  <input type="email" id="correo" placeholder="Tu correo Gmail" style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;">
  <input type="number" id="tokens" placeholder="Tokens (10,20,30...)" style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;">
  <textarea id="comentario" placeholder="Comentario" style="width:100%;padding:12px;margin:8px 0;height:90px;border:1px solid #ddd;border-radius:6px;"></textarea>

  <button onclick="enviarForm()" style="width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:6px;font-size:17px;margin-top:10px;">
    ENVIAR AHORA
  </button>

  <div id="respuesta" style="margin-top:20px;padding:15px;border-radius:6px;"></div>

<script>
async function enviarForm() {
  const datos = {
    name: document.getElementById("nombre").value,
    email: document.getElementById("correo").value,
    tokens: Number(document.getElementById("tokens").value),
    review: document.getElementById("comentario").value
  };

  const res = await fetch("/api/recharge", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });

  const texto = await res.text();
  try {
    const json = JSON.parse(texto);
    const caja = document.getElementById("respuesta");
    if (json.ok) {
      caja.style.background="#dcfce7";
      caja.innerHTML="✅ " + json.mensaje;
    } else {
      caja.style.background="#fee2e2";
      caja.innerHTML="❌ " + json.error;
    }
  } catch(e) {
    console.log("Respuesta rara:", texto);
    alert("Error: El servidor devolvió página, no datos ❌");
  }
}
</script>
</body>
</html>
